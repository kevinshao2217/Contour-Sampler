name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kevinshao2217'

      - name: Run Algorithmic Tests
        run: npm test

      - name: Publish to GitHub Packages
        run: |
          npm publish || echo "Version already published or token permission pending"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
