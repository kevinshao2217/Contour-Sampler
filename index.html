<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour Sampler — 拓撲雙網格邊界提取儀器</title>
<meta name="description" content="Precision dual-grid boundary tracer & equidistant topological isocontour extraction workstation.">
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-glyph" aria-hidden="true" title="Dual-Grid Topological Isocontour Engine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M3 8h18M3 16h18M8 3v18M16 3v18" stroke="var(--border-strong)" stroke-width="0.8" stroke-dasharray="1.5 2" opacity="0.45"/>
        <path d="M12 4C17.5 4 20 7.5 20 12C20 16.5 16.5 20 12 20C6.8 20 4 16.5 4 12C4 7 7.2 4 12 4Z" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="4" r="1.6" fill="var(--surface-deck)" stroke="var(--accent-primary)" stroke-width="1.6"/>
        <circle cx="20" cy="12" r="1.6" fill="var(--surface-deck)" stroke="var(--accent-primary)" stroke-width="1.6"/>
        <circle cx="12" cy="20" r="1.6" fill="var(--surface-deck)" stroke="var(--accent-primary)" stroke-width="1.6"/>
        <circle cx="4" cy="12" r="1.6" fill="var(--surface-deck)" stroke="var(--accent-primary)" stroke-width="1.6"/>
        <path d="M12 8.5C14.5 8.5 15.5 10 15.5 12C15.5 14 14 15.5 12 15.5C9.5 15.5 8.5 14 8.5 12C8.5 10 10 8.5 12 8.5Z" stroke="var(--state-hole)" stroke-width="1.5" stroke-dasharray="2 1.5"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1 class="brand-title" id="txt-title">Contour Sampler</h1>
      <span class="brand-sub" id="txt-sub">拓撲雙網格邊界提取儀器</span>
    </div>
    <span class="brand-badge" id="txt-badge">專業工作台</span>
    <span class="claude-badge" title="Web application built with Claude"><svg class="claude-spark" viewBox="0 0 16 16" width="11" height="11" fill="currentColor"><path d="M8 1l1.8 4.2L14 7l-4.2 1.8L8 13l-1.8-4.2L2 7l4.2-1.8z"/></svg> Built with Claude</span>
  </div>

  <div class="top-actions">
    <div class="lang-switcher" role="group" aria-label="語言切換 / Language">
      <button type="button" class="lang-btn active" id="lang-zh" data-lang="zh">繁中</button>
      <button type="button" class="lang-btn" id="lang-en" data-lang="en">EN</button>
    </div>

    <label class="btn btn-primary" for="file-video" id="tip-open-media">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10.4a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V10.4a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V10.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
      <span id="txt-open-media">開啟媒體檔案</span>
    </label>
    <input id="file-video" type="file" accept="video/*,image/*" hidden>

    <label class="btn" for="file-data" id="tip-import-data">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/></svg>
      <span id="txt-import-data">載入輪廓數據</span>
    </label>
    <input id="file-data" type="file" accept=".ndjson,.jsonl,.json,.csv,.bacs,.bin" hidden>

    <button class="btn btn-demo" id="btn-demo" type="button">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
      <span id="txt-demo">示範動畫序列</span>
    </button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="viewport" id="viewport">
      <div class="vp-reticle" aria-hidden="true">
        <span class="reticle-corner top-left"></span>
        <span class="reticle-corner top-right"></span>
        <span class="reticle-corner bottom-left"></span>
        <span class="reticle-corner bottom-right"></span>
        <div class="reticle-axis-x">X [0, W]</div>
        <div class="reticle-axis-y">Y [0, H]</div>
      </div>
      <canvas id="view"></canvas>
      <div class="drop-hint" id="drop-hint">
        <div class="drop-card">
          <div class="drop-icon-box">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3v13m0-13l-4 4m4-4l4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="drop-heading" id="txt-drop-heading">載入視訊或圖像媒體</div>
          <div class="drop-sub" id="txt-drop-sub">將檔案拖放至畫布，或透過上方工具列開啟</div>
          <div class="drop-tags">
            <span class="tag">MP4</span>
            <span class="tag">WEBM</span>
            <span class="tag">MOV</span>
            <span class="tag">PNG</span>
            <span class="tag">JPG</span>
            <span class="tag">BACS</span>
            <span class="tag">NDJSON</span>
          </div>
          <div class="drop-security" id="txt-drop-sec">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
              <path d="M8 1a2 2 0 0 0-2 2v2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2zm-1 4V3a1 1 0 1 1 2 0v2H7z"/>
            </svg>
            <span>純前端記憶體計算 · 資料不離開瀏覽器</span>
          </div>
        </div>
      </div>
    </div>

    <div class="transport">
      <div class="transport-controls">
        <button class="transport-btn" id="btn-play" type="button">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M6.3 3.6c-.8-.5-1.8.1-1.8 1v10.8c0 .9 1 1.5 1.8 1l8.8-5.4c.8-.5.8-1.5 0-2L6.3 3.6z"/></svg>
        </button>
        <button class="transport-btn" id="btn-prev" type="button">
          <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><rect x="3" y="4" width="2" height="12" rx="0.5"/><path d="M16 4.5a1 1 0 0 0-1.5-.85L6.8 9.15a1 1 0 0 0 0 1.7l7.7 5.5A1 1 0 0 0 16 15.5V4.5z"/></svg>
        </button>
        <button class="transport-btn" id="btn-next" type="button">
          <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path d="M4 4.5A1 1 0 0 1 5.5 3.65l7.7 5.5a1 1 0 0 1 0 1.7l-7.7 5.5A1 1 0 0 1 4 15.5V4.5z"/><rect x="15" y="4" width="2" height="12" rx="0.5"/></svg>
        </button>
      </div>
      
      <div class="scrub-container">
        <input id="seek" type="range" min="0" max="1000" value="0" step="1">
      </div>

      <div class="timecode-box">
        <span class="time-label">TC</span>
        <span class="time" id="time">00:00.00 / 00:00.00</span>
      </div>

      <div class="rate-select-wrap">
        <select id="rate">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.50×</option>
          <option value="1" selected>1.00×</option>
          <option value="2">2.00×</option>
        </select>
      </div>
    </div>

    <div class="stats" id="stats">
      <div class="stat-idle" id="txt-stat-idle">儀器待命 — 請載入視訊源或啟動示範動畫</div>
    </div>
  </section>

  <aside class="panel" id="panel">
    <div id="params"></div>

    <details class="group group-export" open>
      <summary class="group-header">
        <span class="group-title" id="txt-exp-title">05. 數據匯出管道</span>
        <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
      </summary>
      
      <div class="group-content">
        <div class="row">
          <label for="exp-mode" id="txt-exp-mode-label">算圖風格</label>
          <div class="ctl">
            <select id="exp-mode">
              <!-- Dynamically populated according to active language -->
            </select>
          </div>
        </div>

        <div class="row">
          <label for="exp-format" id="txt-exp-fmt-label">編碼封裝格式</label>
          <div class="ctl">
            <select id="exp-format">
              <!-- Dynamically populated according to active language -->
            </select>
          </div>
        </div>
        
        <div class="row two">
          <label id="txt-exp-range-label">時間區間</label>
          <div class="pair">
            <input id="exp-start" type="number" min="0" step="0.01" value="0" aria-label="Start time">
            <span class="range-sep" id="txt-exp-to">至</span>
            <input id="exp-end" type="number" min="0" step="0.01" value="0" aria-label="End time">
            <span class="unit" id="txt-exp-unit">秒</span>
          </div>
        </div>
        
        <div class="row">
          <label for="exp-fps" id="txt-exp-fps-label">提取幀率</label>
          <div class="ctl">
            <input id="exp-fps" type="number" min="1" max="120" step="1" value="30">
            <span class="unit">FPS</span>
          </div>
        </div>
        
        <div class="btns">
          <button class="btn btn-primary btn-full" id="btn-export" type="button">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10.4a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V10.4a.5.5 0 0 1 .5-.5z"/><path d="M5.354 5.854a.5.5 0 0 0 .708 0L7.5 4.414V11.5a.5.5 0 0 0 1 0V4.414l1.438 1.44a.5.5 0 0 0 .708-.708l-2.292-2.293a.5.5 0 0 0-.708 0L5.354 5.146a.5.5 0 0 0 0 .708z"/></svg>
            <span id="txt-btn-export">匯出輪廓軌跡數據</span>
          </button>
          <button class="btn btn-danger btn-full" id="btn-cancel" type="button" hidden>中斷運算任務</button>
        </div>
        
        <div class="progress" id="progress" hidden>
          <div class="bar" id="bar"></div>
          <span id="prog-text">準備運算...</span>
        </div>
        
        <div class="action-grid">
          <button class="btn btn-sm" id="btn-svg" type="button">當前幀 SVG</button>
          <button class="btn btn-sm" id="btn-png" type="button">當前幀 PNG</button>
          <button class="btn btn-sm" id="btn-rec" type="button">錄製視訊 WebM</button>
        </div>
        
        <p class="note" id="txt-exp-note">批次提取執行逐幀確定性步進運算；串流錄製即時捕獲視窗渲染輸出。</p>
      </div>
    </details>

    <div class="panel-footer">
      <div class="attribution-line" title="Designed and implemented with Claude (Anthropic)">
        <span class="spark">✦</span>
        <span id="txt-attr">Built with Claude</span>
      </div>
      <button class="btn btn-ghost" id="btn-reset" type="button">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
        <span id="txt-btn-reset">恢復原廠預設參數</span>
      </button>
    </div>
  </aside>
</main>

<video id="video" playsinline preload="auto" hidden></video>
<img id="image" alt="" hidden>

<script src="src/sampler-core.js"></script>
<script src="src/formats.js"></script>
<script src="web/app.js"></script>
</body>
</html>
